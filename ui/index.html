<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earshot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="window">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg class="logo" viewBox="0 0 20 20" width="18" height="18"><rect width="20" height="20" rx="5" fill="#FFD60A"/><path d="M3.6 11.3c1.7 0 2.5 1.5 4.2 1.5 2.1 0 2.5-6.6 4.9-6.6 2.1 0 2.4 3.9 4.6 3.9" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><circle cx="12.7" cy="6.2" r="1.7" fill="#111"/></svg>
      <b>Earshot</b><span class="ver">1.0.0</span>
    </div>
    <div class="tb-center" data-tauri-drag-region><div id="capsule" class="capsule"></div></div>
    <button id="ab" class="ab" title="A/B bypass (Ctrl+Alt+B)"><span>A</span><span>B</span></button>
    <div class="caption">
      <button data-win="minimize" aria-label="Minimize"><svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg></button>
      <button data-win="toggleMaximize" aria-label="Maximize"><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button data-win="close" class="close" aria-label="Close"><svg width="10" height="10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor"/></svg></button>
    </div>
  </header>
  <div class="body">
    <aside class="sidebar">
      <nav id="nav"></nav>
      <div class="sec"><span>Game profiles</span><span class="sec-r">Auto</span></div>
      <div id="games" class="games scroll"></div>
      <div id="outcard" class="outcard"></div>
    </aside>
    <main id="main">
      <section id="s-eq" class="screen">
        <div class="eqhead">
          <div class="ptitle"><div class="lbl">Active profile</div><h1 id="pname"></h1></div>
          <div id="presets" class="seg"></div>
          <div id="readouts" class="readouts"></div>
        </div>
        <div class="panel graphwrap"><div id="graph"></div></div>
        <div class="panel strip" id="strip"></div>
      </section>
      <section id="s-profiles" class="screen"></section>
      <section id="s-devices" class="screen"></section>
      <section id="s-settings" class="screen"></section>
    </main>
  </div>
  <div id="cursor" class="cursor"><svg width="18" height="22" viewBox="0 0 18 22"><path d="M1.5 1.5v16.2l4.3-4.1 2.8 6.6 2.7-1.2-2.8-6.4h6z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
</div>
<script src="app.js"></script>
</body>
</html>
